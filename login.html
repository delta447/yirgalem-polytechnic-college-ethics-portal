
<!DOCTYPE html>
<html lang="am" class="h-full bg-gray-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ይርጋዓለም ፖሊ ቴክኒክ ኮሌጅ - ግባ (Login)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: { 800: '#1e3a8a', 900: '#0b1d3a' },
                        gold: { 500: '#f59e0b', 600: '#d97706' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Noto Sans Ethiopic', sans-serif; }</style>
</head>
<body class="h-full flex items-center justify-center px-4">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-gold-500 p-8 space-y-6">
        <div class="text-center space-y-2">
            <div class="w-16 h-16 bg-navy-900 text-gold-500 rounded-full flex items-center justify-center mx-auto text-2xl border-2 border-gold-500 shadow">
                <i class="fa-solid fa-scale-balanced"></i>
            </div>
            <h2 class="text-xl font-extrabold text-navy-900">የስነ-ምግባርና ፀረ-ሙስና ፖርታል</h2>
            <p class="text-xs text-gray-500">እባክዎ ለመግባት የይለፍ ቃል ያስገቡ</p>
        </div>

        <form action="index.html?logged=true#services" method="GET" class="space-y-4">
            <input type="hidden" name="logged" value="true">
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">የተጠቃሚ ስም / ኢሜይል</label>
                <input type="text" required placeholder="username or email" class="w-full p-3 rounded-xl border border-gray-300 text-xs focus:outline-none focus:border-gold-500">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">የይለፍ ቃል (Password)</label>
                <input type="password" required placeholder="••••••••" class="w-full p-3 rounded-xl border border-gray-300 text-xs focus:outline-none focus:border-gold-500">
            </div>
            <button type="submit" class="w-full bg-navy-900 hover:bg-navy-800 text-white font-bold py-3.5 rounded-xl text-xs shadow-lg transition border border-gold-500 flex items-center justify-center gap-2">
                <i class="fa-solid fa-right-to-bracket text-gold-500"></i>
                <span>ግባ (Login)</span>
            </button>
        </form>

        <div class="text-center pt-2">
            <a href="index.html" class="text-xs text-navy-900 font-semibold hover:underline flex items-center justify-center gap-1">
                <i class="fa-solid fa-arrow-left"></i> ወደ መነሻ ገጽ ተመለስ
            </a>
        </div>
    </div>
</body>
</html>
